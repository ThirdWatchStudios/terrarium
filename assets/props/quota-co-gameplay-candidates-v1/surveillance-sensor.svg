    <rect id="shell-face" x="45" y="44" width="38" height="29" rx="10" fill="#355247" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
    <rect id="shell-grille" x="51" y="76" width="26" height="7" rx="3" fill="#355247" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="function">
