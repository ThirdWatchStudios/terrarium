<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="standing-desk" data-projection="plan">
  <title>QuotaCo workhorse standing desk</title>
  <desc>Plan-projected molded standing desk with a rear equipment rail, inset writing surface, lift-control pod, keyboard, and mug.</desc>
  <g id="shell">
    <rect id="shell-body" data-fill-token="primary" x="14" y="32" width="100" height="62" rx="13" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="structure">
    <rect id="structure-equipment-rail" data-fill-token="secondary" x="20" y="38" width="88" height="14" rx="7" fill="#355247"/>
    <rect id="structure-writing-surface" x="21" y="54" width="86" height="32" rx="7" fill="#77755D"/>
    <path id="structure-front-seam" d="M27 78H101" fill="none" stroke="#C7BDA7" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  </g>
  <g id="function">
    <rect id="function-monitor" x="48" y="41" width="32" height="10" rx="3" fill="#262B29" stroke="#292C2A" stroke-width="2" stroke-linejoin="round"/>
    <rect id="function-monitor-stand" x="58" y="50" width="12" height="5" rx="2" fill="#18211E"/>
    <rect id="function-keyboard" x="48" y="66" width="32" height="10" rx="3" fill="#F4F0E4"/>
    <path id="function-key-lines" d="M52 70H76" fill="none" stroke="#8E9690" stroke-width="1.5" stroke-linecap="round"/>
    <rect id="function-lift-pod" data-fill-token="accent" x="103" y="61" width="13" height="21" rx="6" fill="#B65F4D" stroke="#292C2A" stroke-width="2" stroke-linejoin="round"/>
    <circle id="function-lift-status" cx="109.5" cy="67" r="2.2" fill="#F4F0E4"/>
    <path id="function-lift-chevron" d="M106.5 76L109.5 73L112.5 76" fill="none" stroke="#F4F0E4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="personalization">
    <circle id="personalization-mug" data-fill-token="accent" cx="27" cy="45" r="4.5" fill="#B65F4D" stroke="#292C2A" stroke-width="2"/>
    <circle id="personalization-coffee" cx="27" cy="45" r="2" fill="#F4F0E4"/>
  </g>
</svg>
