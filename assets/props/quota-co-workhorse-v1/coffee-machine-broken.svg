<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="coffee-machine-broken" data-projection="elevation">
  <title>QuotaCo service-system coffee machine broken state</title>
  <desc>The accepted coffee-machine shell with a cracked carafe, leak, and red service-state marker.</desc>
  <g id="art-envelope" transform="translate(64 116) scale(.84) translate(-64 -116)">
    <g id="shadow">
      <ellipse id="shadow-contact" cx="64" cy="117" rx="21" ry="4" fill="#6E4A2A" opacity=".33"/>
    </g>
    <g id="shell">
      <rect id="shell-body" data-fill-token="primary" x="41" y="53" width="46" height="63" rx="11" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
      <rect id="shell-control-band" data-fill-token="secondary" x="46" y="59" width="36" height="14" rx="6" fill="#355247"/>
      <rect id="shell-base" x="49" y="109" width="30" height="6" rx="3" fill="#49685A"/>
    </g>
    <g id="function">
      <circle id="function-brew-control" cx="53" cy="66" r="3.2" fill="#C84E43" stroke="#292C2A" stroke-width="1.6"/>
      <circle id="function-status-light" cx="63" cy="66" r="2.6" fill="#C84E43"/>
      <rect id="function-cup-bay" x="47" y="77" width="34" height="31" rx="8" fill="#18211E" stroke="#292C2A" stroke-width="2"/>
      <rect id="function-brew-head" x="53" y="78" width="22" height="7" rx="3" fill="#C7BDA7"/>
      <rect id="function-cracked-carafe" x="54" y="90" width="20" height="15" rx="5" fill="#C9D6E0" opacity=".53" stroke="#292C2A" stroke-width="1.7"/>
    </g>
    <g id="state">
      <path id="state-carafe-crack" d="M57 92L63 98L68 94L72 102" fill="none" stroke="#262B29" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="state-floor-leak" d="M75 113Q86 109 91 116Q82 120 73 116Z" fill="#6E4A2A" opacity=".53"/>
      <rect id="state-service-tag" x="45" y="48" width="28" height="9" rx="3" fill="#C84E43" stroke="#292C2A" stroke-width="1.5"/>
      <path id="state-service-mark" d="M50 52H68" fill="none" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round"/>
      <rect id="state-maintenance-seal" data-fill-token="accent" x="76" y="110" width="3" height="3" rx="1" fill="#B65F4D"/>
    </g>
  </g>
</svg>
