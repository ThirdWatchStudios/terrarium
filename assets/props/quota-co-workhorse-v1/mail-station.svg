<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="mail-station" data-projection="elevation">
  <title>QuotaCo mail sorting station</title>
  <desc>Elevation-projected broad mail station with an open pigeonhole matrix, visible envelopes, projecting sorting shelf, paired parcel bays, and grounded plinth.</desc>
  <g id="shadow">
    <ellipse id="shadow-contact" cx="64" cy="117" rx="38" ry="4.5" fill="#000000" opacity=".13"/>
  </g>
