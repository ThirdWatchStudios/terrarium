      <rect id="shell-top-cap" x="30" y="48" width="68" height="11" rx="4" fill="#F3EEDA" stroke="#292C2A" stroke-width="1.6"/>
      <rect id="shell-mail-label" data-fill-token="accent" x="35" y="51" width="18" height="5" rx="1.5" fill="#B65F4D" stroke="#292C2A" stroke-width=".9"/>
      <rect id="shell-pigeonhole-bay" data-fill-token="secondary" x="33" y="61" width="62" height="33" rx="3" fill="#355247" stroke="#292C2A" stroke-width="1.6"/>
      <rect id="function-sort-counter" x="23" y="94" width="82" height="8" rx="3" fill="#F3EEDA" stroke="#292C2A" stroke-width="1.7"/>
      <rect id="function-left-parcel-bay" data-fill-token="secondary" x="33" y="102" width="29" height="10" rx="3" fill="#355247" stroke="#292C2A" stroke-width="1.3"/>
      <rect id="function-right-parcel-bay" x="66" y="102" width="29" height="10" rx="3" fill="#49685A" stroke="#292C2A" stroke-width="1.3"/>
      <rect id="function-left-label" data-fill-token="accent" x="38" y="105" width="14" height="4" rx="1" fill="#B65F4D"/>
      <path id="function-right-parcel" d="M71 110V104H90V110Z" fill="#F4F0E4" stroke="#292C2A" stroke-width=".9"/>
      <rect id="shell-plinth" data-fill-token="secondary" x="34" y="112" width="60" height="4" rx="2" fill="#355247" stroke="#292C2A" stroke-width="1.2"/>
    </g>
