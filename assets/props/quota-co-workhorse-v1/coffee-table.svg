<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="coffee-table" data-projection="plan">
  <title>QuotaCo institutional coffee table</title>
  <desc>Plan-projected low molded tray table with magazines, mug, tiny plant, and a recessed front service edge.</desc>
  <g id="art-scale" transform="translate(64 64) scale(.82) translate(-64 -64)">
    <g id="shell">
      <rect id="shell-table" data-fill-token="primary" x="33" y="43.54" width="62" height="40.92" rx="10" fill="#DED5BD" stroke="#292C2A" stroke-width="3"/>
      <rect id="structure-tray" x="38" y="48.54" width="52" height="30.92" rx="7" fill="#77755D" stroke="#292C2A" stroke-width="1.6"/>
      <rect id="structure-front-recess" x="42" y="77.46" width="44" height="4" rx="2" fill="#18211E"/>
    </g>
    <g id="decor-1">
      <rect id="personalization-magazine-back" x="42" y="51.54" width="21" height="14" rx="2" fill="#F4F0E4" stroke="#292C2A" stroke-width="1.2"/>
      <rect id="personalization-magazine-front" data-fill-token="accent" x="46" y="49.54" width="21" height="14" rx="2" fill="#B65F4D" stroke="#292C2A" stroke-width="1.2"/>
    </g>
    <g id="decor-2">
      <circle id="personalization-mug-shell" cx="82" cy="55.54" r="5" fill="#F3EEDA" stroke="#292C2A" stroke-width="1.3"/>
      <circle id="personalization-coffee" cx="82" cy="55.54" r="2.7" fill="#98513F"/>
      <rect id="personalization-planter" data-fill-token="accent" x="73" y="67.46" width="9" height="9" rx="2" fill="#B65F4D"/>
      <path id="personalization-plant" data-fill-token="secondary" d="M77 68Q70 58 81 58Q87 61 77 68Z" fill="#49685A" stroke="#292C2A" stroke-width="1.2"/>
    </g>
  </g>
</svg>
