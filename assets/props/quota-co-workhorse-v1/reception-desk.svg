<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="reception-desk" data-projection="plan">
  <title>QuotaCo workhorse reception desk</title>
  <desc>Plan-projected molded reception counter with a continuous public ledge, operator return, monitor, bell, and service control.</desc>
  <g id="shell">
    <path id="shell-l-body" data-fill-token="primary" d="M28 20H100Q108 20 108 28V49H54V105Q54 111 48 111H28Q20 111 20 103V28Q20 20 28 20Z" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="structure">
    <rect id="structure-public-surface" data-fill-token="secondary" x="27" y="27" width="74" height="15" rx="7" fill="#355247"/>
    <rect id="structure-return-surface" x="27" y="48" width="20" height="52" rx="7" fill="#49685A"/>
    <rect id="structure-writing-inset" x="32" y="56" width="10" height="30" rx="4" fill="#77755D"/>
    <rect id="structure-public-ledge" x="55" y="43" width="46" height="8" rx="4" fill="#C7BDA7"/>
    <path id="structure-ledge-seam" d="M62 47H94" fill="none" stroke="#77755D" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="function">
    <rect id="function-monitor" x="32" y="65" width="12" height="22" rx="3" fill="#262B29" stroke="#292C2A" stroke-width="2"/>
    <rect id="function-monitor-stand" x="36" y="60" width="4" height="6" rx="2" fill="#18211E"/>
    <circle id="function-bell" data-fill-token="accent" cx="91" cy="34" r="5" fill="#B65F4D" stroke="#292C2A" stroke-width="2"/>
    <circle id="function-bell-cap" cx="91" cy="31" r="2.1" fill="#F4F0E4"/>
    <rect id="function-service-control" data-fill-token="accent" x="18" y="83" width="9" height="16" rx="4" fill="#B65F4D" stroke="#292C2A" stroke-width="2"/>
  </g>
</svg>
