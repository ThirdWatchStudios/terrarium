<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="cubicle-workstation" data-projection="plan">
  <title>QuotaCo workhorse cubicle workstation</title>
  <desc>Plan-projected one-person cubicle with a continuous molded privacy shell, inset desk, compact bucket chair, papers, and mug.</desc>
  <g id="shell">
    <path id="shell-privacy-body" data-fill-token="primary" d="M23 14H105Q113 14 113 22V108H96V35H32V108H15V22Q15 14 23 14Z" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="structure">
    <rect id="structure-top-inset" data-fill-token="secondary" x="26" y="20" width="76" height="9" rx="4" fill="#355247"/>
    <rect id="structure-left-inset" x="20" y="28" width="8" height="67" rx="4" fill="#49685A"/>
    <rect id="structure-right-inset" x="100" y="28" width="8" height="67" rx="4" fill="#49685A"/>
    <rect id="structure-writing-surface" x="36" y="35" width="56" height="36" rx="8" fill="#77755D" stroke="#292C2A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g id="function">
    <rect id="function-monitor" x="48" y="40" width="32" height="9" rx="3" fill="#262B29" stroke="#292C2A" stroke-width="2"/>
    <rect id="function-monitor-stand" x="59" y="48" width="10" height="5" rx="2" fill="#18211E"/>
    <path id="function-chair-shell" data-fill-token="primary" d="M49 89Q49 80 58 78H70Q79 80 79 89V99Q76 106 64 108Q52 106 49 99Z" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
    <rect id="function-chair-seat" data-fill-token="secondary" x="55" y="84" width="18" height="15" rx="6" fill="#355247"/>
    <rect id="function-chair-tab" data-fill-token="accent" x="59" y="102" width="10" height="5" rx="2" fill="#B65F4D"/>
  </g>
  <g id="personalization">
    <rect id="personalization-papers" x="41" y="57" width="23" height="9" rx="2" fill="#F4F0E4"/>
    <circle id="personalization-mug" data-fill-token="accent" cx="78" cy="60" r="4.2" fill="#B65F4D" stroke="#292C2A" stroke-width="1.8" display="none"/>
  </g>
</svg>
