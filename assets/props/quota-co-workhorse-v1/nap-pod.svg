<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="nap-pod" data-projection="elevation">
  <title>QuotaCo institutional nap pod</title>
  <desc>Elevation-projected recovery pod with a molded base, visible mattress and blanket, pillow, foot controls, and retractable clamshell privacy visor.</desc>
  <g id="shadow">
    <ellipse id="shadow-contact" cx="64" cy="117" rx="39" ry="5" fill="#000000" opacity=".12"/>
  </g>
  <g id="art-scale" transform="translate(64 116) scale(.9) translate(-64 -116)">
    <g id="shell">
      <path id="shell-base" data-fill-token="primary" d="M14 114L16 98Q17 88 28 85L88 82Q103 82 111 94L114 114Z" fill="#DED5BD" stroke="#292C2A" stroke-width="3"/>
      <rect id="structure-base-recess" x="24" y="106" width="76" height="9" rx="3" fill="#18211E" stroke="#292C2A" stroke-width="1.5"/>
      <path id="structure-mattress" data-fill-token="secondary" d="M27 101L32 86L81 73Q95 70 102 82L97 99L38 108Z" fill="#355247" stroke="#292C2A" stroke-width="2.2"/>
      <path id="personalization-blanket" d="M39 87L67 80L74 98L42 105Z" fill="#49685A" stroke="#292C2A" stroke-width="1.5"/>
      <path id="function-pillow" d="M80 78Q91 72 98 79L96 88L81 91Q76 84 80 78Z" fill="#F3EEDA" stroke="#292C2A" stroke-width="1.6"/>
      <path id="personalization-blanket-seam" d="M45 91L69 85" fill="none" stroke="#C7BDA7" stroke-width="1.4" opacity=".8"/>
    </g>
    <g id="controls">
      <rect id="controls-foot-console" data-fill-token="secondary" x="17" y="87" width="15" height="20" rx="5" fill="#355247" stroke="#292C2A" stroke-width="1.7"/>
      <rect id="controls-screen" x="20" y="91" width="9" height="5" rx="2" fill="#18211E"/>
      <circle id="controls-status" data-fill-token="accent" cx="24.5" cy="100" r="2.6" fill="#B65F4D"/>
      <circle id="controls-button" cx="28" cy="100" r="1.3" fill="#F3EEDA"/>
    </g>
    <g id="visor-down">
      <path id="visor-down-shell" data-fill-token="primary" d="M67 88Q78 49 98 51Q114 53 117 70Q120 88 106 102L98 95Q107 83 106 71Q104 61 96 60Q82 61 75 90Z" fill="#DED5BD" stroke="#292C2A" stroke-width="2.7"/>
      <path id="visor-down-window" d="M75 86Q83 61 97 61Q108 63 109 74Q110 87 101 95L95 89Q101 80 99 72Q97 67 91 68Q82 71 78 89Z" fill="#8FB7C0" stroke="#292C2A" stroke-width="1.7" opacity=".78"/>
      <path id="visor-down-wear" d="M104 60Q114 70 111 85" fill="none" stroke="#C7BDA7" stroke-width="1.6" opacity=".85"/>
    </g>
    <g id="visor-up" display="none">
      <rect id="visor-up-dock" data-fill-token="primary" x="101" y="72" width="9" height="27" rx="4" fill="#DED5BD" stroke="#292C2A" stroke-width="2"/>
      <path id="visor-up-outer-rail" d="M72 87Q88 66 105 73" fill="none" stroke="#C7BDA7" stroke-width="3.2"/>
      <path id="visor-up-inner-rail" d="M78 87Q91 72 103 78" fill="none" stroke="#8FB7C0" stroke-width="2.2" opacity=".8"/>
    </g>
  </g>
</svg>
