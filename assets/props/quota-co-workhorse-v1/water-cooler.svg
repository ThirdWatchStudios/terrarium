<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="water-cooler" data-projection="elevation">
  <title>QuotaCo service-system water cooler</title>
  <desc>Elevation water cooler with a compact bottle cowl and a waist-height hot and cold service console.</desc>
  <g id="art-envelope" transform="translate(64 116) scale(.86) translate(-64 -116)">
    <g id="shadow">
      <ellipse id="shadow-contact" cx="64" cy="117" rx="23" ry="4" fill="#000000" opacity=".125"/>
    </g>
    <g id="bottle">
      <rect id="bottle-reservoir" x="51" y="25" width="26" height="32" rx="9" fill="#8FB7C0" stroke="#292C2A" stroke-width="2.5"/>
      <ellipse id="bottle-waterline" cx="64" cy="47" rx="9" ry="3.5" fill="#CDE1E3" opacity=".67"/>
      <path id="bottle-glint" d="M55 37Q64 33 73 37" fill="none" stroke="#F3EEDA" stroke-width="2" opacity=".8" stroke-linecap="round"/>
      <rect id="bottle-neck" x="56" y="51" width="16" height="13" rx="5" fill="#C7BDA7" stroke="#292C2A" stroke-width="2"/>
    </g>
    <g id="shell">
      <rect id="shell-cabinet" data-fill-token="primary" x="40" y="58" width="48" height="58" rx="11" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
      <rect id="shell-service-band" data-fill-token="secondary" x="46" y="65" width="36" height="24" rx="7" fill="#355247"/>
      <rect id="shell-base" x="51" y="105" width="27" height="6" rx="3" fill="#49685A"/>
    </g>
    <g id="function">
      <rect id="function-service-recess" x="50" y="70" width="28" height="14" rx="5" fill="#18211E"/>
      <rect id="function-hot-tap" data-fill-token="accent" x="51" y="91" width="12" height="11" rx="4" fill="#B65F4D" stroke="#292C2A" stroke-width="1.8"/>
      <rect id="function-cold-tap" x="66" y="91" width="12" height="11" rx="4" fill="#8FB7C0" stroke="#292C2A" stroke-width="1.8"/>
    </g>
  </g>
</svg>
