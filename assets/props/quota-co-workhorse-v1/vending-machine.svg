<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="vending-machine" data-projection="elevation">
  <title>QuotaCo service-system vending machine</title>
  <desc>Elevation vending machine with a catalog window, explicit payment spine, and broad retrieval bay.</desc>
  <g id="art-envelope" transform="translate(64 116) scale(.86) translate(-64 -116)">
    <g id="shadow">
      <ellipse id="shadow-contact" cx="64" cy="117" rx="28" ry="4.5" fill="#000000" opacity=".125"/>
    </g>
    <g id="shell">
      <rect id="shell-body" data-fill-token="primary" x="34" y="25" width="60" height="91" rx="11" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
      <rect id="shell-catalog-frame" data-fill-token="secondary" x="40" y="34" width="38" height="58" rx="7" fill="#355247" stroke="#292C2A" stroke-width="2"/>
      <rect id="shell-payment-spine" x="80" y="36" width="10" height="51" rx="5" fill="#49685A"/>
      <rect id="shell-base" x="39" y="110" width="50" height="5" rx="3" fill="#49685A"/>
    </g>
    <g id="function">
      <rect id="function-catalog-window" x="43" y="39" width="32" height="48" rx="5" fill="#18211E"/>
      <rect id="function-payment-display" x="82" y="42" width="6" height="8" rx="2" fill="#8FB7C0"/>
      <circle id="function-payment-control" data-fill-token="accent" cx="85" cy="58" r="2.5" fill="#B65F4D"/>
      <rect id="function-card-reader" x="82" y="66" width="6" height="12" rx="2" fill="#F3EEDA"/>
      <rect id="function-retrieval-bay" x="43" y="97" width="38" height="12" rx="5" fill="#18211E" stroke="#292C2A" stroke-width="2"/>
      <rect id="function-retrieval-mouth" x="49" y="100" width="26" height="5" rx="2" fill="#262B29"/>
    </g>
    <g id="stock">
      <rect id="stock-row-1-1" x="45" y="48" width="6" height="9" rx="2" fill="#B65F4D"/>
      <rect id="stock-row-1-2" x="54" y="48" width="6" height="9" rx="2" fill="#F3EEDA"/>
      <rect id="stock-row-1-3" x="63" y="48" width="6" height="9" rx="2" fill="#8FB7C0"/>
      <rect id="stock-row-2-1" x="45" y="62" width="6" height="9" rx="2" fill="#98513F"/>
      <rect id="stock-row-2-2" x="54" y="62" width="6" height="9" rx="2" fill="#DED5BD"/>
      <rect id="stock-row-2-3" x="63" y="62" width="6" height="9" rx="2" fill="#49685A"/>
      <rect id="stock-row-3-1" x="45" y="76" width="6" height="9" rx="2" fill="#B65F4D"/>
      <rect id="stock-row-3-2" x="54" y="76" width="6" height="9" rx="2" fill="#F3EEDA"/>
      <rect id="stock-row-3-3" x="63" y="76" width="6" height="9" rx="2" fill="#8FB7C0"/>
    </g>
  </g>
</svg>
