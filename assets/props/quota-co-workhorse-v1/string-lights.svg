<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="string-lights" data-projection="plan">
  <title>QuotaCo employee string lights</title>
  <desc>Plan-authored wall-slot string lights with molded mounting clips, a dark sagging cable, and four to eight editable warm bulbs.</desc>
  <metadata>Palette tokens: primary mounting clips, secondary cable inserts, accent service end. Default bulb count 6.</metadata>
  <g id="mounts">
    <rect id="mount-left-shell" data-fill-token="primary" x="5" y="43" width="10" height="13" rx="5" fill="#DED5BD" stroke="#292C2A" stroke-width="1.8"/>
    <rect id="mount-right-shell" data-fill-token="primary" x="113" y="43" width="10" height="13" rx="5" fill="#DED5BD" stroke="#292C2A" stroke-width="1.8"/>
    <rect id="mount-left-inset" data-fill-token="secondary" x="8" y="47" width="5" height="5" rx="2" fill="#262B29"/>
    <rect id="mount-right-service" data-fill-token="accent" x="116" y="47" width="5" height="5" rx="2" fill="#B65F4D"/>
  </g>
  <g id="cable">
    <path id="cable-sag" d="M12 49Q64 62 116 49" fill="none" stroke="#262B29" stroke-width="2.4"/>
  </g>
  <g id="bulb-1">
