    <ellipse id="bulb-1-lamp" cx="20" cy="59" rx="3.6" ry="4.5" fill="#E1B464" stroke="#292C2A" stroke-width="1.2"/>
    <path id="bulb-1-filament" d="M19 58Q20 61 21 58" fill="none" stroke="#F4F0E4" stroke-width=".9"/>
  </g>
