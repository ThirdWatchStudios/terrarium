<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-prop-id="water-cooler-empty" data-projection="elevation">
  <title>QuotaCo service-system water cooler empty state</title>
  <desc>The accepted water-cooler shell with a drained bottle and explicit out-of-service marker.</desc>
  <g id="art-envelope" transform="translate(64 116) scale(.86) translate(-64 -116)">
    <g id="shadow">
      <ellipse id="shadow-contact" cx="64" cy="117" rx="23" ry="4" fill="#000000" opacity=".125"/>
    </g>
    <g id="bottle">
      <rect id="bottle-reservoir" x="51" y="25" width="26" height="32" rx="9" fill="#E8EEF2" opacity=".53" stroke="#292C2A" stroke-width="2.5"/>
      <rect id="bottle-empty-band" x="52" y="35" width="24" height="6" rx="3" fill="#F3EEDA"/>
      <rect id="bottle-neck" x="56" y="51" width="16" height="13" rx="5" fill="#C7BDA7" stroke="#292C2A" stroke-width="2"/>
    </g>
    <g id="shell">
      <rect id="shell-cabinet" data-fill-token="primary" x="40" y="58" width="48" height="58" rx="11" fill="#DED5BD" stroke="#292C2A" stroke-width="3" stroke-linejoin="round"/>
      <rect id="shell-service-band" data-fill-token="secondary" x="46" y="65" width="36" height="24" rx="7" fill="#355247"/>
      <rect id="shell-base" x="51" y="105" width="27" height="6" rx="3" fill="#49685A"/>
    </g>
    <g id="function">
      <rect id="function-service-recess" x="50" y="70" width="28" height="14" rx="5" fill="#18211E"/>
      <rect id="function-hot-tap" x="51" y="91" width="12" height="11" rx="4" fill="#C84E43" stroke="#292C2A" stroke-width="1.8"/>
      <rect id="function-cold-tap" x="66" y="91" width="12" height="11" rx="4" fill="#8FB7C0" stroke="#292C2A" stroke-width="1.8"/>
    </g>
    <g id="state">
      <rect id="state-service-tag" x="49" y="74" width="30" height="10" rx="3" fill="#C84E43" stroke="#292C2A" stroke-width="1.5"/>
      <path id="state-service-mark" d="M54 79H74" fill="none" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round"/>
      <rect id="state-maintenance-seal" data-fill-token="accent" x="76" y="106" width="3" height="4" rx="1" fill="#B65F4D"/>
    </g>
  </g>
</svg>
