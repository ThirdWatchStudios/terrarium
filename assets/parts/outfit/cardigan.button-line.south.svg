    <path id="detail/button-line/button-lower" d="M -4.6 7.35 a 1.6 1.6 0 1 0 3.2 0 a 1.6 1.6 0 1 0 -3.2 0 Z" fill="#00000033" fill-rule="nonzero"/>
  </g>
