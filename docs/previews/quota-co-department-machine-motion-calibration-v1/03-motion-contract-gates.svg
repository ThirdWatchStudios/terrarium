<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1220" viewBox="0 0 1960 1220"><rect width="1960" height="1220" fill="#E7E1D2"/><text x="36" y="48" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="860" fill="#292C2A" text-anchor="start">MACHINE MOTION · CONTRACT GATES</text><text x="36" y="78" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#626861" text-anchor="start">Nothing below is an export promise until the frame read and ownership split are approved.</text><rect x="36" y="108" width="1240" height="1048" rx="12" fill="#F6F1E6" stroke="#A39B8B" stroke-width="2"/><text x="58" y="148" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="840" fill="#294B3C" text-anchor="start">RECOMMENDED FIRST CONTRACT</text><text x="58" y="206" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">1. FRAME VOCABULARY</text><text x="58" y="242" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">Begin with one four-frame working loop per animated SKU; the accepted static sprite remains the idle frame.</text><text x="58" y="374" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">2. STATE OWNERSHIP</text><text x="58" y="410" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">The sim chooses idle/working/blocked and playback rate; Terrarium owns aligned pixels and moving-part</text><text x="58" y="432" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">membership.</text><text x="58" y="542" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">3. PHASE DESYNCHRONIZATION</text><text x="58" y="578" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">The sim assigns a stable per-instance phase offset so machine rows never cycle in lockstep.</text><text x="58" y="710" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">4. POLLUTION BOUNDARY</text><text x="58" y="746" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">Motion implies the source mechanically; heat haze, fumes, sound rings, glow, and meters remain separate</text><text x="58" y="768" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">presentation effects.</text><text x="58" y="878" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">5. EXPORT SHAPE</text><text x="58" y="914" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">Add optional animations[] to department manifest v4; keep project schema v21 because this remains derived</text><text x="58" y="936" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">content.</text><rect x="1308" y="108" width="616" height="500" rx="12" fill="#E4ECE8" stroke="#A39B8B" stroke-width="2"/><text x="1330" y="148" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="840" fill="#294B3C" text-anchor="start">TERRARIUM OWNS</text><text x="1330" y="190" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">frame pixels · pivots · moving-part membership · source</text><text x="1330" y="212" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">alignment · sprite-sheet order · far-scale readability</text><rect x="1308" y="640" width="616" height="516" rx="12" fill="#F2E4DE" stroke="#A39B8B" stroke-width="2"/><text x="1330" y="680" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="840" fill="#B65F4D" text-anchor="start">SIM OWNS</text><text x="1330" y="722" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">machine state · start/stop · playback rate · stable phase</text><text x="1330" y="744" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">offset · pollution magnitude · sound · heat haze · fumes ·</text><text x="1330" y="766" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">jams and degradation triggers</text><text x="1330" y="934" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#B65F4D" text-anchor="start">NEVER BAKED INTO SKU</text><text x="1330" y="970" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">meters · readouts · glow · amber/rose accents · camera</text><text x="1330" y="992" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="620" fill="#292C2A" text-anchor="start">cues · smoke clouds · sound rings · wear · clutter</text></svg>