-width="1"/><path id="docket-5" d="M 71 74 H 82 V 89 H 71 Z" fill="#D9D0B9" stroke="#252A28" stroke-width="1.5"/><path d="M 74 79 H 79 M 74 83 H 78" stroke="#4E7D79" stroke-width="1"/><path id="index-crest" d="M 45 29 H 80 V 43 H 45 Z" fill="#D9D0B9" stroke="#252A28" stroke-width="2"/><path id="index-slots" d="M 50 34 H 59 M 64 34 H 75" stroke="#4E7D79" stroke-width="2"/><rect id="collector-plinth" x="32" y="101" width="63" height="12" rx="4" fill="#294B3C"/><path id="service-register" d="M 43 106 H 84" stroke="#4E7D79" stroke-width="2.5" stroke-linecap="round"/></g></svg><text x="1150" y="508" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="720" fill="#626861" text-anchor="middle">drums + paper path</text><text x="1554" y="508" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="720" fill="#626861" text-anchor="middle">open cage + indexed folios</text><rect x="36" y="616" width="1808" height="396" rx="14" fill="#F2E4DE" stroke="#A39B8B" stroke-width="1.5"/><text x="58" y="656" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="850" fill="#294B3C" text-anchor="start">RATIFIED EXPORT DECISIONS</text><text x="58" y="704" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="820" fill="#B65F4D" text-anchor="start">1. APPROVALS IDENTIFIERS</text><text x="58" y="742" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">Use adjudication_desk_set and docket_rack as stable</text><text x="58" y="764" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">facility ids.</text><text x="653" y="704" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="820" fill="#B65F4D" text-anchor="start">2. DOCKET RACK FOOTPRINT</text><text x="653" y="742" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">Keep the Docket Rack at 1×1 so the shared collector does</text><text x="653" y="764" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">not dominate the farm.</text><text x="1248" y="704" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="820" fill="#B65F4D" text-anchor="start">3. DOCKET FILL STATES</text><text x="1248" y="742" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">Bake empty/low/high/overflowing variants; the backlog cage</text><text x="1248" y="764" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="640" fill="#292C2A" text-anchor="start">is Approvals saturation read.</text><text x="58" y="920" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="840" fill="#294B3C" text-anchor="start">UNCHANGED CONTRACTS</text><text x="58" y="950" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="620" fill="#292C2A" text-anchor="start">1×1 seat station · accepted cubicle baffles · hand distribution within room · base-plus-stamp canisters · amber/rose reserved · static machines until</text><text x="58" y="970" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="620" fill="#292C2A" text-anchor="start">animation is separately ratified</text></svg>